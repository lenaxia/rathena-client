name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Zero goroutines in pkg/
        run: |
          result=$(grep -r "^\s*go " pkg/ --include="*.go" | grep -v "_test.go" || true)
          if [ -n "$result" ]; then
            echo "FAIL: goroutines found in pkg/:"
            echo "$result"
            exit 1
          fi

      - name: Benchmarks (0 allocs/op)
        run: |
          go test -bench=. -benchmem ./pkg/... | tee bench.txt
          # Only fixed-size packet encode/decode benchmarks must be 0 allocs.
          # Variable-length encoders ([]byte return), trace callbacks,
          # inventory list decoders, and the party-roster decoder
          # (ZC_GROUP_LIST — variable-length members[] slice) legitimately
          # allocate — exclude them.
          # The allowlist below covers every current variable-length encoder
          # that has a benchmark. When adding a new variable-length encoder
          # benchmark, add its name here too (or the check will fail loudly,
          # which is the desired forcing function).
          if grep -P "\s[1-9]\d* allocs/op" bench.txt | grep -vP \
            "BenchmarkDecode(Normal|Equip)Items|BenchmarkZcGroupList|BenchmarkEncode(BattleChat|PartyChat|Whisper|RepairItem|GuildChat|NpcTalkText|ShopBuy|ShopSell|PublicChat)|BenchmarkRegisterAndFeed|BenchmarkFeed_With(TraceFunc|NilTrace)|BenchmarkSend_With(TraceFunc|NilTrace)"; then
            echo "FAIL: unexpected non-zero allocs found in benchmarks"
            exit 1
          fi
